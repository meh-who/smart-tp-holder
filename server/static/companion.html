<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#b9b8b4">
<title>The roll</title>
<style>
  :root {
    --bg: #b9b8b4;          /* the wall */
    --disc: #d4d3cf;        /* the roll, end-on */
    --core: #bcb7ad;        /* the cardboard core */
    --ink: #111110;
    --muted: #8e8d89;
    --faint: #a3a29e;
    --sheet: #c6c5c1;
    --ok: #2f7d4f;
    --off: #8e8d89;
    --warn: #8a5a12;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #232322; --disc: #343432; --core: #575653; --ink: #f2f1ee; --muted: #8b8a86; --faint: #6f6e6a; --sheet: #2c2c2a; --ok: #6fc28f; --off: #6f6e6a; --warn: #e2b46a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.35 "Inter", ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
  .app { position: relative; height: 100dvh; max-width: 520px; margin: 0 auto; display: grid;
    grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top); }

  /* top line */
  .top { display: flex; align-items: center; gap: 10px; padding: 16px 22px 0; z-index: 2; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 70%,100% { box-shadow: 0 0 0 10px transparent; } }
  .top b { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
  .top span { color: var(--muted); font-size: 14px; }

  /* the wheel */
  .stage { position: relative; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  .stage:active { cursor: grabbing; }
  .disc { position: absolute; border-radius: 50%; background: var(--disc); transition: background .4s; }
  .core { position: absolute; border-radius: 50%; background: var(--core); }
  .num { position: absolute; left: 0; top: 0; will-change: transform, opacity;
    font-weight: 400; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1; }
  .unit { position: absolute; color: var(--muted); font-size: 13px; letter-spacing: .02em; text-align: right; line-height: 1.3; }
  .unit b { display: block; color: var(--ink); font-weight: 600; font-size: 15px; letter-spacing: 0; }

  /* bottom options */
  .row { display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 12px calc(14px + env(safe-area-inset-bottom)); z-index: 2; }
  .opt { appearance: none; border: 0; background: none; color: inherit; font: inherit; padding: 10px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; border-radius: 14px; }
  .opt:active { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .opt svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .opt b { font-size: 17px; font-weight: 600; }
  .opt small { font-size: 13px; color: var(--muted); max-width: 13ch; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt small.warn { color: var(--warn); }

  /* footer */
  /* ✕ / ✓ bar: only while choosing a feed or confirming a new roll, laid over the bottom so the roll never resizes */
  .foot { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 64px 1fr 64px; align-items: center;
    padding: 6px 18px calc(18px + env(safe-area-inset-bottom)); z-index: 4; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .foot.open { opacity: 1; pointer-events: auto; }
  .x, .ok { appearance: none; border: 0; cursor: pointer; display: grid; place-items: center; transition: opacity .25s, transform .25s; }
  .x { width: 44px; height: 44px; background: none; color: var(--ink); }
  .x svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .ok { width: 60px; height: 60px; border-radius: 50%; background: var(--ink); color: var(--bg); justify-self: end; }
  .ok svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ok:disabled { opacity: .35; cursor: default; }
  .hide { opacity: 0; pointer-events: none; transform: scale(.85); }
  .label { text-align: center; color: var(--muted); font-size: 16px; }

  /* feed chooser: slides up over the options row */
  .sheet { position: absolute; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom)); padding: 8px 18px 4px; z-index: 3;
    background: var(--bg); transform: translateY(16px); opacity: 0; pointer-events: none; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .25s; }
  .sheet.open { transform: none; opacity: 1; pointer-events: auto; }
  .choice { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; width: 100%; text-align: left;
    appearance: none; border: 0; background: none; color: inherit; font: inherit; padding: 13px 4px; border-top: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); cursor: pointer; }
  .choice:first-child { border-top: 0; }
  .choice b { font-size: 17px; font-weight: 600; }
  .choice small { grid-column: 1; color: var(--muted); font-size: 13px; }
  .choice .radio { grid-row: 1 / span 2; grid-column: 2; width: 22px; height: 22px; border-radius: 50%; border: 1.6px solid var(--muted); }
  .choice[aria-checked="true"] .radio { border: 7px solid var(--ink); }
  .choice[disabled] { opacity: .45; cursor: default; }
  .choice .link { grid-column: 1; justify-self: start; font-size: 13px; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; padding: 0; background: none; border: 0; font: inherit; font-size: 13px; cursor: pointer; }

  .confirm { padding: 14px 4px 18px; display: grid; gap: 6px; }
  .confirm b { font-size: 19px; font-weight: 600; }
  .confirm small { color: var(--muted); font-size: 14px; }
  .toast { white-space: nowrap; position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -10px); opacity: 0;
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; transition: .25s; pointer-events: none; z-index: 9; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="dot" id="dot"></div><b id="name">The roll</b><span id="seen">connecting…</span></div>

  <div class="stage" id="stage" aria-label="Sheets left on the roll">
    <div class="disc" id="disc"></div>
    <div class="core" id="core"></div>
    <div class="unit" id="unit"><b>sheets</b>pulled</div>
  </div>

  <div class="row" id="row">
    <button class="opt" id="optFeed" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24"><path d="M5 19a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/></svg>
      <b>Feed</b><small id="feedSub">—</small>
    </button>
    <button class="opt" id="optStatus" type="button">
      <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg>
      <b>Status</b><small id="statusSub">—</small>
    </button>
    <button class="opt" id="optRoll" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      <b>New roll</b><small id="rollSub">reset to 0</small>
    </button>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-label="Choose"></div>

  <div class="foot" id="foot">
    <button class="x hide" id="xBtn" type="button" aria-label="Cancel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="label" id="footLabel"></div>
    <button class="ok hide" id="okBtn" type="button" aria-label="Read this feed"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const HOLDER = "__HOLDER_ID__";
  const api = p => `/api/holder/${encodeURIComponent(HOLDER)}${p}`;
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let state = null, mode = null, picked = null;     // mode: null | "feed" | "roll"

  // ---------------------------------------------------------------- wheel ---
  // The half-disc is the roll seen end-on; the numbers count sheets pulled from
  // this roll, from 0. The wheel eases toward the real count, can be flicked by
  // hand and springs back. Each pull scrolls the next number up from below.
  const stage = $("stage"), disc = $("disc"), core = $("core"), unit = $("unit");
  const SPAN = 7;                       // numbers drawn either side of centre
  const nodes = [];
  for (let i = 0; i < SPAN * 2 + 1; i++) { const n = document.createElement("div"); n.className = "num"; stage.appendChild(n); nodes.push(n); }
  let G = null;                         // geometry
  let value = 0, target = 0, vel = 0;
  let dragging = false, dragY = 0, dragV = 0, lastMove = 0, lastInteract = performance.now();

  function layout() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const R = Math.min(W * 0.70, H * 0.47);  // whole roll stays inside the stage, top to bottom
    const cx = W * 0.48 + R, cy = H * 0.50;
    const big = Math.max(46, Math.min(92, R * 0.22));            // centre number size
    const rt = R - big * 0.95;          // radius the numbers ride on
    const step = Math.asin(Math.min(0.9, big * 1.22 / rt));      // angle between numbers
    G = { W, H, R, cx, cy, big, rt, step };
    Object.assign(disc.style, { width: `${2 * R}px`, height: `${2 * R}px`, left: `${cx - R}px`, top: `${cy - R}px` });
    const Rc = R * 0.40;                // a real roll: ~44 mm core in a ~110 mm roll
    Object.assign(core.style, { width: `${2 * Rc}px`, height: `${2 * Rc}px`, left: `${cx - Rc}px`, top: `${cy - Rc}px` });
    Object.assign(unit.style, { right: `${W - (cx - R) + 14}px`, top: `${cy - 18}px` });
  }

  function mix(a, b, t) { return `color-mix(in srgb, ${a} ${Math.round((1 - t) * 100)}%, ${b})`; }

  function draw() {
    if (!G) return;
    const base = Math.round(value);
    for (let i = 0; i < nodes.length; i++) {
      const n = base - SPAN + i;
      const d = value - n;                 // signed distance from centre, in sheets
      const el = nodes[i];
      if (n < 0 || Math.abs(d) > 3.6) { el.style.opacity = 0; continue; }
      const a = -d * G.step * (1 - 0.045 * Math.min(Math.abs(d), 6));  // larger n below centre, so counting up scrolls upward; outer ones pack tighter
      const x = G.cx - G.rt * Math.cos(a);
      const y = G.cy + G.rt * Math.sin(a);
      const ad = Math.abs(d);
      const s = Math.max(0.42, 1 - 0.13 * ad);
      const o = Math.max(0, 1 - 0.15 * ad);
      el.textContent = n;
      el.style.fontSize = `${G.big}px`;
      el.style.fontWeight = ad < 0.5 ? 500 : 400;
      el.style.color = mix("var(--ink)", "var(--faint)", Math.min(1, ad / 3.2));
      el.style.opacity = o;
      el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${s})`;
    }
  }

  function tick(now) {
    if (!dragging) {
      // critically-damped spring toward the target
      const k = reduce ? 1 : 0.085, damp = 0.78;
      vel = (vel + (target - value) * k) * damp;
      value += vel;
      if (Math.abs(target - value) < 0.002 && Math.abs(vel) < 0.002) { value = target; vel = 0; }
      // idle hint: every ~7 s of stillness, a small scroll that springs back
      if (!reduce && now - lastInteract > 7000 && Math.abs(vel) < 0.001) { vel = 0.09; lastInteract = now; }
    }
    draw();
    requestAnimationFrame(tick);
  }

  // drag / flick / mouse wheel
  const sheetsPerPx = () => 1 / (G.big * 1.05);
  stage.addEventListener("pointerdown", e => { dragging = true; dragY = e.clientY; dragV = 0; lastMove = performance.now(); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", e => {
    if (!dragging) return;
    const now = performance.now(), dy = e.clientY - dragY;
    value = Math.max(0, value - dy * sheetsPerPx());                   // content follows the finger
    dragV = (-dy * sheetsPerPx()) / Math.max(1, now - lastMove) * 16; dragY = e.clientY; lastMove = now; lastInteract = now;
  });
  const release = () => { if (!dragging) return; dragging = false; vel = dragV; lastInteract = performance.now(); };
  stage.addEventListener("pointerup", release); stage.addEventListener("pointercancel", release);
  stage.addEventListener("wheel", e => { e.preventDefault(); vel += e.deltaY * 0.0016; lastInteract = performance.now(); }, { passive: false });

  new ResizeObserver(() => { layout(); draw(); }).observe(stage);
  layout(); requestAnimationFrame(tick);

  // ------------------------------------------------------------- data ---
  const fmtAgo = s => s == null ? "never" : s < 5 ? "just now" : s < 60 ? `${s} s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
  const labelOf = (s, id) => (s.services.find(x => x.id === id) || {}).label || id;

  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }

  let firstData = true;
  function render(s) {
    state = s;
    $("name").textContent = s.holder.name || s.holder.id;
    $("dot").classList.toggle("on", !!s.online);
    $("seen").textContent = s.online ? (s.playing ? "speaking" : "online") : (s.last_seen_s == null ? "not heard from yet" : `offline · seen ${fmtAgo(s.last_seen_s)}`);

    // wheel target: sheets pulled from this roll, counting up from 0
    const pulled = Math.max(0, s.sheets_this_roll || 0);
    if (firstData) { value = 0; vel = 0; firstData = false; }          // open by rolling up from 0
    target = pulled;

    // row
    const actual = s.holder_source || s.built_source || s.desired_source;
    const fs = $("feedSub");
    if (s.bulletin.status === "building") { fs.textContent = "preparing…"; fs.className = "warn"; }
    else if (s.bulletin.status === "error") { fs.textContent = "couldn't load"; fs.className = "warn"; }
    else if (s.desired_source !== actual && s.online) { fs.textContent = `switching…`; fs.className = "warn"; }
    else { fs.textContent = labelOf(s, actual); fs.className = ""; }
    $("statusSub").textContent = s.online ? (s.playing ? "speaking" : "online") : "offline";
    $("rollSub").textContent = s.roll_reset_pending ? "syncing…" : "reset to 0";
    $("rollSub").className = s.roll_reset_pending ? "warn" : "";
    if (mode) $("footLabel").textContent = mode === "feed" ? "Choose feed" : "Start a new roll?";

    if (mode === "feed") buildChooser();
  }

  async function refresh() {
    try {
      const r = await fetch(api("/status"), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status === 403 ? "Tap the holder with your phone to open this page." : `HTTP ${r.status}`);
      render(await r.json());
    } catch (e) { $("seen").textContent = e.message; }
  }

  // ---------------------------------------------------------- chooser ---
  function buildChooser() {
    const s = state; if (!s) return;
    const box = $("sheet"); box.innerHTML = "";
    if (picked == null) picked = s.desired_source;
    for (const svc of s.services) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "choice"; b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", String(picked === svc.id));
      const usable = svc.id === "news" || svc.configured;
      if (!usable) b.disabled = true;
      const sub = svc.id === "news" ? "Public headlines · no login"
        : !svc.configured ? "Not set up on this server"
        : svc.connected ? (svc.account ? `Connected as ${svc.account}` : "Connected")
        : "Tap ✓ to log in";
      b.innerHTML = `<b>${svc.label}</b><span class="radio"></span><small>${sub}</small>`;
      if (svc.connected && svc.id !== "news" && svc.account !== "curated set") {
        const l = document.createElement("span"); l.className = "link"; l.textContent = "Disconnect"; l.setAttribute("role", "button");
        l.onclick = ev => { ev.stopPropagation(); disconnect(svc.id); };
        b.appendChild(l);
      }
      b.onclick = () => { picked = svc.id; buildChooser(); };
      box.appendChild(b);
    }
    $("okBtn").disabled = !picked || (picked === s.desired_source && picked === (s.holder_source || s.built_source));
  }

  function openChooser() {
    if (!state) return;
    mode = "feed"; picked = null; buildChooser();
    $("sheet").classList.add("open"); $("row").style.visibility = "hidden"; $("foot").classList.add("open");
    $("xBtn").classList.remove("hide"); $("okBtn").classList.remove("hide"); $("footLabel").textContent = "Choose feed";
  }
  function openRoll() {
    if (!state) return;
    mode = "roll";
    const n = Math.max(0, state.sheets_this_roll || 0);
    $("sheet").innerHTML = `<div class="confirm"><b>Finished or replaced the roll?</b><small>The count goes back to 0. This roll: ${n} sheet${n === 1 ? "" : "s"}.${state.online ? "" : " The holder is offline; it will reset when it reconnects."}</small></div>`;
    $("sheet").classList.add("open"); $("row").style.visibility = "hidden"; $("foot").classList.add("open");
    $("okBtn").disabled = false;
    $("xBtn").classList.remove("hide"); $("okBtn").classList.remove("hide"); $("footLabel").textContent = "Start a new roll?";
  }
  async function confirmRoll() {
    try {
      const r = await fetch(api("/new-roll"), { method: "POST" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      target = 0; toast("Count reset to 0");
    } catch (e) { toast(e.message); }
    closeChooser(); refresh();
  }
  function closeChooser() {
    mode = null;
    $("sheet").classList.remove("open"); $("row").style.visibility = ""; $("foot").classList.remove("open");
    $("xBtn").classList.add("hide"); $("okBtn").classList.add("hide");
    if (state) render(state);
  }

  async function confirmChoice() {
    const s = state, svc = s.services.find(x => x.id === picked);
    if (!svc) return;
    if (svc.id !== "news" && !svc.connected) { location.href = `/auth/${svc.id}/start?holder=${encodeURIComponent(HOLDER)}`; return; }
    try {
      const r = await fetch(api("/source"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ source: svc.id }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
      toast(`Preparing ${svc.label}…`);
      vel = 0.6;                           // a little roll to mark the change
    } catch (e) { toast(e.message); }
    closeChooser(); refresh();
  }

  async function disconnect(id) {
    if (!confirm(`Disconnect ${labelOf(state, id)} from this holder?`)) return;
    await fetch(api("/disconnect"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ provider: id }) });
    refresh();
  }

  $("optFeed").onclick = openChooser;
  $("optStatus").onclick = () => { refresh(); toast(state && state.online ? `Online · checked in ${fmtAgo(state.last_seen_s)}` : "The holder isn't connected right now"); };
  $("optRoll").onclick = openRoll;
  $("xBtn").onclick = closeChooser;
  $("okBtn").onclick = () => (mode === "roll" ? confirmRoll() : confirmChoice());

  const q = new URLSearchParams(location.search);
  if (q.get("connected")) { toast(`${q.get("connected")} connected`); history.replaceState(null, "", location.pathname); }
  refresh();
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 5000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
})();
</script>
</body>
</html>
