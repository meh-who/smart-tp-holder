<text x="24" y="744" class="t" text-anchor="start">Pin map: encoder A → 32, B → 33 · button → 27 · LED → 21 · amp BCLK → A0 (GPIO26), LRC → A1 (GPIO25), DIN → A5 (GPIO4), SD → MO (GPIO18) · amp VIN → USB pin (5 V) · all grounds → GND.</text>
<text x="24" y="766" class="t" text-anchor="start">Do not use pin 12 for anything with a pull-up (the board will not boot), and A2/A3/A4/A13 are input-only. 3V3 comes from the Feather's 3V pin; the amp must NOT run from 3V (it takes the 5 V USB pin).</text>
<text x="24" y="788" class="t" text-anchor="start">Encoder: solder it to a scrap of perfboard, middle pin = common (check with a meter while turning slowly). A/B as a twisted pair, away from the speaker leads, JST-PH at the board end.</text>
<text x="24" y="810" class="t" text-anchor="start">GAIN: the 3 W 8 Ω speaker at 5 V is plenty with GAIN left open (9 dB). If it is too quiet in the room, link GAIN to GND (12 dB). Do not link GAIN to VIN — that lowers it to 6 dB.</text>
<text x="24" y="832" class="t" text-anchor="start">Battery option: a LiPo in the Feather's JST socket and MAINS_POWERED 0; then feed the amp from BAT instead of USB. The battery gauge is built in on A13 (GPIO35).</text>
